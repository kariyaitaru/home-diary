<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おうち日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EB;
    --card:#FFFFFF;
    --ink:#2B2A27;
    --ink-soft:#6B675F;
    --line:#DFDACC;
    --night:#38455C;
    --night-soft:#E7EAF0;
    --morning:#DD8F60;
    --morning-soft:#F7E3D3;
    --wet-yes:#C1694D;
    --wet-no:#7A8F72;
    --radius-card:18px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .display{font-family:'Fraunces', serif;}

  header.app-header{
    padding:24px 20px 16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  header.app-header h1{
    font-size:26px;
    font-weight:600;
    margin:0;
    letter-spacing:0.02em;
  }
  header.app-header p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  .account-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
    padding-top:2px;
  }
  .account-bar .email{
    font-size:11px;
    color:var(--ink-soft);
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .icon-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{transform:scale(0.94);}
  .text-link-btn{
    background:none;border:none;
    color:var(--ink-soft);
    font-size:11px;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
    padding:0;
  }

  .tabs-wrap{
    display:flex;
    gap:8px;
    padding:0 20px 14px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs-wrap::-webkit-scrollbar{display:none;}
  .child-pill{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:var(--radius-pill);
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .child-pill.active{
    background:var(--night);
    border-color:var(--night);
    color:#fff;
  }
  .child-pill.add{
    color:var(--night);
    border-style:dashed;
    background:transparent;
  }

  main{
    padding:0 20px;
    max-width:520px;
    margin:0 auto;
  }

  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 4px 18px;
  }
  .date-nav button{
    width:38px;height:38px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .date-nav button:active{transform:scale(0.94);}
  .date-center{
    text-align:center;
    cursor:pointer;
  }
  .date-center .big-date{
    font-size:22px;
    font-weight:600;
  }
  .date-center .sub-date{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  input[type="date"].hidden-date{
    position:absolute;
    opacity:0;
    pointer-events:none;
    width:1px;height:1px;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius-card);
    border:1px solid var(--line);
    padding:20px;
    margin-bottom:14px;
  }
  .field-label{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .field-label .dot{
    width:6px;height:6px;border-radius:50%;
  }
  .dot.night{background:var(--night);}
  .dot.morning{background:var(--morning);}

  .seg{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .seg button{
    flex:1 1 auto;
    min-width:70px;
    padding:10px 8px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:all .15s ease;
  }
  .seg button.sel-yes{
    background:var(--wet-yes);
    border-color:var(--wet-yes);
    color:#fff;
  }
  .seg button.sel-no{
    background:var(--wet-no);
    border-color:var(--wet-no);
    color:#fff;
  }
  .seg button.sel-morning{
    background:var(--morning);
    border-color:var(--morning);
    color:#fff;
  }

  .wet-amount{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .chip{
    padding:8px 14px;
    border-radius:var(--radius-pill);
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    user-select:none;
  }
  .chip.on{
    background:var(--wet-yes);
    border-color:var(--wet-yes);
    color:#fff;
  }

  .time-row{
    display:flex;
    gap:12px;
  }
  .time-field{
    flex:1 1 0;
    min-width:0;
  }
  .time-field label{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:6px;
  }
  input[type="time"]{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    padding:10px 8px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
  }
  @media (max-width:340px){
    .time-row{flex-direction:column;}
  }

  textarea{
    width:100%;
    min-height:90px;
    padding:12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    resize:vertical;
  }
  .char-count{
    text-align:right;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .char-count.over{color:var(--wet-yes);}

  .save-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:4px;
  }
  .save-btn{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:none;
    background:var(--night);
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:0.02em;
  }
  .save-btn:active{transform:scale(0.98);}
  .save-status{
    font-size:12px;
    color:var(--ink-soft);
    min-width:80px;
    text-align:center;
  }

  .section-title{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    margin:26px 4px 10px;
  }

  .history-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .history-item:active{background:var(--night-soft);}
  .history-left .h-date{
    font-weight:700;
    font-size:14px;
  }
  .history-left .h-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .history-badge{
    font-size:11px;
    padding:4px 10px;
    border-radius:var(--radius-pill);
    white-space:nowrap;
  }
  .badge-wet{background:var(--morning-soft); color:var(--wet-yes);}
  .badge-dry{background:var(--night-soft); color:var(--night);}

  .empty-note{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:24px 0;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(43,42,39,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-box{
    background:var(--card);
    border-radius:18px;
    padding:22px;
    width:100%;
    max-width:340px;
  }
  .modal-box h3{
    margin:0 0 14px;
    font-family:'Fraunces', serif;
    font-size:18px;
  }
  .modal-box input[type="text"]{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:15px;
    font-family:inherit;
    margin-bottom:16px;
  }
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:none;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .modal-actions .cancel{background:var(--paper); color:var(--ink-soft);}
  .modal-actions .confirm{background:var(--night); color:#fff;}
  .modal-actions .danger{background:var(--wet-yes); color:#fff;}

  .child-manage{
    text-align:center;
    margin-top:6px;
  }
  .child-manage button{
    background:none;border:none;
    color:var(--ink-soft);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
  }

  /* --- auth / setup gate --- */
  .gate-card p{
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 16px;
  }
  .gate-card .gate-title{
    font-size:19px;
    margin:0 0 10px;
  }
  .gbtn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .gbtn:active{transform:scale(0.98);}
  .setup-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:4px;
  }
  .option-btn{
    width:100%;
    text-align:left;
    padding:14px 16px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-family:inherit;
  }
  .option-btn .opt-title{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
  }
  .option-btn .opt-desc{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .id-input-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .id-input-row input{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:13px;
    font-family:inherit;
  }
  .id-input-row button{
    padding:10px 14px;
    border-radius:10px;
    border:none;
    background:var(--night);
    color:#fff;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .file-id-box{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    word-break:break-all;
    margin:10px 0;
    color:var(--ink-soft);
  }
  .error-note{
    background:var(--morning-soft);
    color:var(--wet-yes);
    border-radius:10px;
    padding:10px 12px;
    font-size:12.5px;
    margin-bottom:14px;
  }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <h1 class="display">おうち日誌</h1>
    <p>こどもの毎日をきろくする</p>
  </div>
  <div class="account-bar" id="accountBar"></div>
</header>

<div id="gateArea"></div>

<div id="appRoot" style="display:none;">
  <div class="tabs-wrap" id="tabsWrap"></div>

  <main>
    <div class="date-nav">
      <button id="prevDay">‹</button>
      <div class="date-center" id="dateCenter">
        <div class="big-date display" id="bigDate">--</div>
        <div class="sub-date" id="subDate">--</div>
      </div>
      <button id="nextDay">›</button>
    </div>
    <input type="date" id="hiddenDate" class="hidden-date">

    <div id="formArea"></div>

    <div class="child-manage">
      <button id="renameChildBtn">この子の名前を変更</button>
      &nbsp;·&nbsp;
      <button id="deleteChildBtn">この子を削除</button>
    </div>

    <div class="section-title display">最近の記録</div>
    <div id="historyArea"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script>
// =====================================================================
// Google Cloud の設定値をここに入れてください
// 1) console.cloud.google.com でプロジェクトを作成
// 2) Google Drive API と Google Picker API を有効化
// 3) OAuth同意画面を設定（外部 / テスト、家族のGoogleアカウントをテストユーザーに追加）
// 4) OAuthクライアントID（ウェブアプリケーション）を作成し、
//    「承認済みのJavaScript生成元」にこのアプリを公開するURLを登録
// 5) 下の2つの値を、発行されたものに置き換えてください
// =====================================================================
const GOOGLE_CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';
const GOOGLE_API_KEY   = 'YOUR_API_KEY';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
const DATA_FILE_NAME = 'child-diary-data.json';
const CONFIG_READY = GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID') === -1;

// ---------- state ----------
let accessToken = null;
let tokenClient = null;
let pickerLoaded = false;
let currentUserEmail = null;
let fileId = localStorage.getItem('gdiary_file_id') || null;

let appData = { children: [], entries: {} }; // { children:[{id,name}], entries:{childId:{dateStr:entry}} }
let currentChildId = null;
let currentDate = new Date();
let currentEntry = defaultEntry();

function defaultEntry(){
  return {
    wet: null,               // 'yes' | 'no' | null
    wetAmount: {pants:false, pajama:false, sheet:false},
    morningUrine: null,      // 'none'|'little'|'normal'|'much'
    dinnerTime: '18:00',
    bedTime: '21:00',
    memo: ''
  };
}
function getChildEntries(id){
  if(!appData.entries[id]) appData.entries[id] = {};
  return appData.entries[id];
}
function dateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function formatBig(d){
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function formatSub(d){
  const w=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年 (${w})`;
}
function uid(){
  return 'c_' + Math.random().toString(36).slice(2,10);
}

// ---------- Google sign-in ----------
function onGisLoad(){
  if(!CONFIG_READY) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp)=>{
      if(resp.error){
        renderGate('error', 'ログインできませんでした（'+resp.error+'）。同意画面のテストユーザーにこのアカウントが追加されているかご確認ください。');
        return;
      }
      accessToken = resp.access_token;
      currentUserEmail = await fetchUserEmail();
      renderAccountBar();
      if(fileId){
        const ok = await driveLoadData();
        if(ok){ showApp(); return; }
      }
      renderGate('setup');
    }
  });
}
function signIn(){
  if(!CONFIG_READY){ renderGate('config-missing'); return; }
  if(!tokenClient){ renderGate('error', 'Googleログインの準備が完了していません。少し待ってから再度お試しください。'); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}
function signOut(){
  if(accessToken){
    try{ google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
  }
  accessToken = null;
  currentUserEmail = null;
  appData = { children: [], entries: {} };
  currentChildId = null;
  document.getElementById('appRoot').style.display = 'none';
  renderAccountBar();
  renderGate('signedout');
}
async function fetchUserEmail(){
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers:{ Authorization:`Bearer ${accessToken}` }
    });
    if(!res.ok) return null;
    const j = await res.json();
    return j.email || null;
  }catch(e){ return null; }
}

// ---------- Google Drive data file ----------
async function driveLoadData(){
  try{
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers:{ Authorization:`Bearer ${accessToken}` }
    });
    if(!res.ok) throw new Error('status '+res.status);
    const text = await res.text();
    const parsed = text ? JSON.parse(text) : {};
    appData = { children: parsed.children || [], entries: parsed.entries || {} };
    return true;
  }catch(e){
    console.error('drive load failed', e);
    return false;
  }
}
async function driveSaveData(){
  if(!fileId || !accessToken) return false;
  try{
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH',
      headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':'application/json' },
      body: JSON.stringify(appData)
    });
    return res.ok;
  }catch(e){
    console.error('drive save failed', e);
    return false;
  }
}
async function driveCreateFile(){
  const boundary = 'diaryBoundary_' + Date.now();
  const metadata = { name: DATA_FILE_NAME, mimeType: 'application/json' };
  const initial = { children: [], entries: {} };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(initial)}\r\n` +
    `--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method:'POST',
    headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
    body
  });
  if(!res.ok) throw new Error('create failed '+res.status);
  const json = await res.json();
  fileId = json.id;
  localStorage.setItem('gdiary_file_id', fileId);
  appData = initial;
  return fileId;
}
function gapiPickerLoad(){
  return new Promise((resolve)=>{
    if(pickerLoaded) return resolve();
    if(typeof gapi === 'undefined'){ resolve(); return; }
    gapi.load('picker', ()=>{ pickerLoaded = true; resolve(); });
  });
}
async function openPicker(){
  await gapiPickerLoad();
  if(typeof google === 'undefined' || !google.picker){
    renderGate('setup', 'ファイル選択ツールを読み込めませんでした。下の「ファイルIDを直接入力」をお使いください。');
    return;
  }
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json');
  const picker = new google.picker.PickerBuilder()
    .setOAuthToken(accessToken)
    .setDeveloperKey(GOOGLE_API_KEY)
    .addView(view)
    .setCallback(async (data)=>{
      if(data.action === google.picker.Action.PICKED){
        fileId = data.docs[0].id;
        localStorage.setItem('gdiary_file_id', fileId);
        const ok = await driveLoadData();
        if(ok){ showApp(); }
        else { renderGate('setup', 'このファイルを読み込めませんでした。共有設定（編集者権限）をご確認ください。'); }
      }
    })
    .build();
  picker.setVisible(true);
}
async function useManualId(id){
  const trimmed = id.trim();
  if(!trimmed) return;
  fileId = trimmed;
  localStorage.setItem('gdiary_file_id', fileId);
  const ok = await driveLoadData();
  if(ok){ showApp(); }
  else { renderGate('setup', 'そのIDのファイルを読み込めませんでした。IDと共有権限（編集者）をご確認ください。'); }
}
function switchDataFile(){
  fileId = null;
  localStorage.removeItem('gdiary_file_id');
  document.getElementById('appRoot').style.display = 'none';
  renderGate('setup');
}

// ---------- gate / account bar rendering ----------
function renderAccountBar(){
  const bar = document.getElementById('accountBar');
  if(!accessToken){ bar.innerHTML = ''; return; }
  bar.innerHTML = `
    ${currentUserEmail ? `<span class="email">${currentUserEmail}</span>` : ''}
    <button class="icon-btn" id="refreshBtn" title="最新のデータを取得">⟳</button>
    <button class="icon-btn" id="logoutBtn" title="ログアウト">⎋</button>
  `;
  document.getElementById('logoutBtn').onclick = signOut;
  document.getElementById('refreshBtn').onclick = async ()=>{
    if(!fileId) return;
    const ok = await driveLoadData();
    if(ok){
      if(currentChildId && !appData.children.find(c=>c.id===currentChildId)){
        currentChildId = appData.children.length ? appData.children[0].id : null;
      }
      renderTabs();
      loadEntryForCurrentDate();
      renderForm();
      renderHistory();
    }
  };
}

function renderGate(state, message){
  const gate = document.getElementById('gateArea');
  if(state === 'config-missing'){
    gate.innerHTML = `
      <main><div class="card gate-card">
        <h2 class="display gate-title">設定が未完了です</h2>
        <p>コード上部の <code>GOOGLE_CLIENT_ID</code> と <code>GOOGLE_API_KEY</code> を、Google Cloud Consoleで発行した値に置き換えてから、このページをGitHub Pagesなど公開URLで開いてください。</p>
      </div></main>`;
    return;
  }
  if(state === 'signedout'){
    gate.innerHTML = `
      <main><div class="card gate-card">
        ${message ? `<div class="error-note">${message}</div>` : ''}
        <h2 class="display gate-title">はじめる</h2>
        <p>Googleアカウントでログインすると、家族で共有しているきろくを見たり書いたりできます。</p>
        <button class="gbtn" id="signInBtn">Googleでログイン</button>
      </div></main>`;
    document.getElementById('signInBtn').onclick = signIn;
    return;
  }
  if(state === 'error'){
    gate.innerHTML = `
      <main><div class="card gate-card">
        <div class="error-note">${message||'エラーが発生しました。'}</div>
        <button class="gbtn" id="retryBtn">もう一度ログイン</button>
      </div></main>`;
    document.getElementById('retryBtn').onclick = signIn;
    return;
  }
  if(state === 'setup'){
    gate.innerHTML = `
      <main><div class="card gate-card">
        ${message ? `<div class="error-note">${message}</div>` : ''}
        <h2 class="display gate-title">きろくファイルを選ぶ</h2>
        <p>家族で共有するデータファイルをひとつ決めます。すでに誰かが作っている場合はそのファイルを選び、はじめての場合は新しく作成してください。</p>
        <div class="setup-options">
          <button class="option-btn" id="createFileBtn">
            <div class="opt-title">＋ 新しく作成する（はじめての方）</div>
            <div class="opt-desc">自分のDriveにデータファイルを作成し、あとで家族と共有します</div>
          </button>
          <button class="option-btn" id="openPickerBtn">
            <div class="opt-title">共有されたファイルを選ぶ</div>
            <div class="opt-desc">家族から共有されたファイルをDriveから選びます</div>
          </button>
        </div>
        <p style="margin-top:16px;">またはファイルIDを直接入力：</p>
        <div class="id-input-row">
          <input type="text" id="manualIdInput" placeholder="ファイルID">
          <button id="manualIdBtn">開く</button>
        </div>
      </div></main>`;
    document.getElementById('createFileBtn').onclick = async ()=>{
      try{
        const id = await driveCreateFile();
        showApp();
        setTimeout(()=> showShareInfo(id), 200);
      }catch(e){
        renderGate('setup', 'ファイルの作成に失敗しました。もう一度お試しください。');
      }
    };
    document.getElementById('openPickerBtn').onclick = openPicker;
    document.getElementById('manualIdBtn').onclick = ()=> useManualId(document.getElementById('manualIdInput').value);
    return;
  }
}

function showShareInfo(id){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <h3 class="display">家族と共有する</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 10px;">Google Driveでこのファイルを開き、共有相手を「編集者」として追加してください。相手には下のファイルIDを伝えるか、Drive上で共有すれば「共有されたファイルを選ぶ」から開けます。</p>
        <div class="file-id-box">${id}</div>
        <div class="modal-actions">
          <a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener" class="gbtn" style="text-decoration:none;display:flex;">Driveで開いて共有設定</a>
        </div>
        <div class="modal-actions" style="margin-top:10px;">
          <button class="cancel" id="closeShareInfo">閉じる</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeShareInfo').onclick = ()=> root.innerHTML='';
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') root.innerHTML=''; };
}

function showApp(){
  document.getElementById('gateArea').innerHTML = '';
  document.getElementById('appRoot').style.display = 'block';
  if(appData.children.length && !currentChildId){
    currentChildId = appData.children[0].id;
  }
  renderTabs();
  loadEntryForCurrentDate();
  renderForm();
  renderHistory();
  if(!appData.children.length){
    setTimeout(openAddChildModal, 300);
  }
}

// ---------- rendering: tabs ----------
function renderTabs(){
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = '';
  appData.children.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'child-pill' + (c.id===currentChildId ? ' active' : '');
    btn.textContent = c.name;
    btn.onclick = ()=> switchChild(c.id);
    wrap.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'child-pill add';
  addBtn.textContent = '＋ 追加';
  addBtn.onclick = openAddChildModal;
  wrap.appendChild(addBtn);
}

function switchChild(id){
  currentChildId = id;
  renderTabs();
  loadEntryForCurrentDate();
  renderForm();
  renderHistory();
}

// ---------- date nav ----------
function renderDateNav(){
  document.getElementById('bigDate').textContent = formatBig(currentDate);
  document.getElementById('subDate').textContent = formatSub(currentDate);
  document.getElementById('hiddenDate').value = dateKey(currentDate);
}

function loadEntryForCurrentDate(){
  if(!currentChildId){ currentEntry = defaultEntry(); return; }
  const map = getChildEntries(currentChildId);
  const key = dateKey(currentDate);
  currentEntry = map[key] ? JSON.parse(JSON.stringify(map[key])) : defaultEntry();
}

// ---------- form ----------
function renderForm(){
  renderDateNav();
  const area = document.getElementById('formArea');
  if(!currentChildId){
    area.innerHTML = `<div class="card"><div class="empty-note">まずは「＋ 追加」からお子さんを登録してください</div></div>`;
    return;
  }
  const e = currentEntry;
  area.innerHTML = `
    <div class="card">
      <div class="field-label"><span class="dot morning"></span>おねしょ</div>
      <div class="seg">
        <button data-wet="no" class="${e.wet==='no'?'sel-no':''}">なし</button>
        <button data-wet="yes" class="${e.wet==='yes'?'sel-yes':''}">あり</button>
      </div>
      <div class="wet-amount" id="wetAmountBox" style="display:${e.wet==='yes'?'flex':'none'}">
        <div class="chip ${e.wetAmount.pants?'on':''}" data-amt="pants">パンツ</div>
        <div class="chip ${e.wetAmount.pajama?'on':''}" data-amt="pajama">パジャマ</div>
        <div class="chip ${e.wetAmount.sheet?'on':''}" data-amt="sheet">シーツ</div>
      </div>
    </div>

    <div class="card">
      <div class="field-label"><span class="dot morning"></span>朝の尿量</div>
      <div class="seg">
        <button data-mu="none" class="${e.morningUrine==='none'?'sel-morning':''}">無し</button>
        <button data-mu="little" class="${e.morningUrine==='little'?'sel-morning':''}">少ない</button>
        <button data-mu="normal" class="${e.morningUrine==='normal'?'sel-morning':''}">普通</button>
        <button data-mu="much" class="${e.morningUrine==='much'?'sel-morning':''}">多い</button>
      </div>
    </div>

    <div class="card">
      <div class="field-label"><span class="dot night"></span>時刻</div>
      <div class="time-row">
        <div class="time-field">
          <label>夕食時刻</label>
          <input type="time" id="dinnerTime" step="1800" value="${e.dinnerTime||'18:00'}">
        </div>
        <div class="time-field">
          <label>就寝時刻</label>
          <input type="time" id="bedTime" step="1800" value="${e.bedTime||'21:00'}">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="field-label"><span class="dot night"></span>メモ</div>
      <textarea id="memo" maxlength="200" placeholder="気づいたことなど">${e.memo||''}</textarea>
      <div class="char-count" id="charCount">${(e.memo||'').length}/200</div>
    </div>

    <div class="save-bar">
      <button class="save-btn" id="saveBtn">保存する</button>
      <div class="save-status" id="saveStatus"></div>
    </div>
  `;

  area.querySelectorAll('[data-wet]').forEach(b=>{
    b.onclick = ()=>{
      currentEntry.wet = currentEntry.wet === b.dataset.wet ? null : b.dataset.wet;
      if(currentEntry.wet !== 'yes'){
        currentEntry.wetAmount = {pants:false,pajama:false,sheet:false};
      }
      renderForm();
    };
  });
  area.querySelectorAll('[data-amt]').forEach(c=>{
    c.onclick = ()=>{
      const k = c.dataset.amt;
      currentEntry.wetAmount[k] = !currentEntry.wetAmount[k];
      renderForm();
    };
  });
  area.querySelectorAll('[data-mu]').forEach(b=>{
    b.onclick = ()=>{
      currentEntry.morningUrine = currentEntry.morningUrine === b.dataset.mu ? null : b.dataset.mu;
      renderForm();
    };
  });
  document.getElementById('dinnerTime').oninput = (ev)=> currentEntry.dinnerTime = ev.target.value;
  document.getElementById('bedTime').oninput = (ev)=> currentEntry.bedTime = ev.target.value;
  const memoEl = document.getElementById('memo');
  memoEl.oninput = (ev)=>{
    currentEntry.memo = ev.target.value.slice(0,200);
    const cc = document.getElementById('charCount');
    cc.textContent = `${currentEntry.memo.length}/200`;
    cc.classList.toggle('over', currentEntry.memo.length>=200);
  };
  document.getElementById('saveBtn').onclick = saveCurrentEntry;
}

async function saveCurrentEntry(){
  if(!currentChildId) return;
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = '保存中…';
  const map = getChildEntries(currentChildId);
  const key = dateKey(currentDate);
  const isEmpty = !currentEntry.wet && !currentEntry.morningUrine &&
    !currentEntry.dinnerTime && !currentEntry.bedTime && !currentEntry.memo;
  if(isEmpty){
    delete map[key];
  }else{
    map[key] = currentEntry;
  }
  const ok = await driveSaveData();
  statusEl.textContent = ok ? '保存しました' : '保存に失敗しました（通信をご確認ください）';
  renderHistory();
  setTimeout(()=>{ if(statusEl) statusEl.textContent=''; }, 2500);
}

// ---------- history ----------
function renderHistory(){
  const area = document.getElementById('historyArea');
  if(!currentChildId){ area.innerHTML=''; return; }
  const map = getChildEntries(currentChildId);
  const keys = Object.keys(map).sort((a,b)=> b.localeCompare(a)).slice(0,14);
  if(keys.length===0){
    area.innerHTML = `<div class="empty-note">まだ記録がありません</div>`;
    return;
  }
  area.innerHTML = keys.map(k=>{
    const e = map[k];
    const d = new Date(k+'T00:00:00');
    const wetLabel = e.wet==='yes' ? 'おねしょ あり' : (e.wet==='no' ? 'おねしょ なし' : '');
    const muLabel = {none:'朝：無し',little:'朝：少ない',normal:'朝：普通',much:'朝：多い'}[e.morningUrine] || '';
    const metaParts = [muLabel, e.dinnerTime?`夕食 ${e.dinnerTime}`:'', e.bedTime?`就寝 ${e.bedTime}`:''].filter(Boolean);
    return `
      <div class="history-item" data-date="${k}">
        <div class="history-left">
          <div class="h-date">${formatBig(d)}（${['日','月','火','水','木','金','土'][d.getDay()]}）</div>
          <div class="h-meta">${metaParts.join(' ・ ') || '記録あり'}</div>
        </div>
        ${wetLabel ? `<div class="history-badge ${e.wet==='yes'?'badge-wet':'badge-dry'}">${wetLabel}</div>` : ''}
      </div>
    `;
  }).join('');
  area.querySelectorAll('.history-item').forEach(item=>{
    item.onclick = ()=>{
      currentDate = new Date(item.dataset.date+'T00:00:00');
      loadEntryForCurrentDate();
      renderForm();
      document.getElementById('dateCenter').scrollIntoView({behavior:'smooth', block:'center'});
    };
  });
}

// ---------- modals ----------
function openAddChildModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <h3 class="display">お子さんを追加</h3>
        <input type="text" id="newChildName" placeholder="名前（例：たろう）" maxlength="20">
        <div class="modal-actions">
          <button class="cancel" id="cancelAdd">キャンセル</button>
          <button class="confirm" id="confirmAdd">追加する</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelAdd').onclick = ()=> root.innerHTML='';
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') root.innerHTML=''; };
  document.getElementById('confirmAdd').onclick = async ()=>{
    const name = document.getElementById('newChildName').value.trim();
    if(!name) return;
    const child = {id: uid(), name};
    appData.children.push(child);
    root.innerHTML = '';
    await driveSaveData();
    switchChild(child.id);
  };
}

function openRenameModal(){
  if(!currentChildId) return;
  const child = appData.children.find(c=>c.id===currentChildId);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <h3 class="display">名前を変更</h3>
        <input type="text" id="renameInput" value="${child.name}" maxlength="20">
        <div class="modal-actions">
          <button class="cancel" id="cancelRename">キャンセル</button>
          <button class="confirm" id="confirmRename">変更する</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelRename').onclick = ()=> root.innerHTML='';
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') root.innerHTML=''; };
  document.getElementById('confirmRename').onclick = async ()=>{
    const name = document.getElementById('renameInput').value.trim();
    if(!name) return;
    child.name = name;
    root.innerHTML = '';
    await driveSaveData();
    renderTabs();
  };
}

function openDeleteModal(){
  if(!currentChildId) return;
  const child = appData.children.find(c=>c.id===currentChildId);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="ov">
      <div class="modal-box">
        <h3 class="display">${child.name}さんを削除しますか？</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 16px;">記録もすべて削除されます。この操作は取り消せません。</p>
        <div class="modal-actions">
          <button class="cancel" id="cancelDel">キャンセル</button>
          <button class="danger" id="confirmDel">削除する</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelDel').onclick = ()=> root.innerHTML='';
  document.getElementById('ov').onclick = (ev)=>{ if(ev.target.id==='ov') root.innerHTML=''; };
  document.getElementById('confirmDel').onclick = async ()=>{
    appData.children = appData.children.filter(c=>c.id!==currentChildId);
    delete appData.entries[currentChildId];
    root.innerHTML = '';
    await driveSaveData();
    currentChildId = appData.children.length ? appData.children[0].id : null;
    if(currentChildId){ switchChild(currentChildId); }
    else { renderTabs(); renderForm(); renderHistory(); }
  };
}

// ---------- date nav events ----------
document.getElementById('prevDay').onclick = ()=>{
  currentDate.setDate(currentDate.getDate()-1);
  loadEntryForCurrentDate();
  renderForm();
};
document.getElementById('nextDay').onclick = ()=>{
  currentDate.setDate(currentDate.getDate()+1);
  loadEntryForCurrentDate();
  renderForm();
};
document.getElementById('dateCenter').onclick = ()=>{
  document.getElementById('hiddenDate').showPicker ? document.getElementById('hiddenDate').showPicker() : document.getElementById('hiddenDate').click();
};
document.getElementById('hiddenDate').onchange = (ev)=>{
  if(!ev.target.value) return;
  currentDate = new Date(ev.target.value+'T00:00:00');
  loadEntryForCurrentDate();
  renderForm();
};
document.getElementById('renameChildBtn').onclick = openRenameModal;
document.getElementById('deleteChildBtn').onclick = openDeleteModal;

// ---------- init ----------
if(!CONFIG_READY){
  renderGate('config-missing');
}else{
  renderGate('signedout');
}
</script>

<script src="https://accounts.google.com/gsi/client" async defer onload="onGisLoad()"></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</body>
